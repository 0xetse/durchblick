# Update proposals for GitHub Actions (SHA pins) and npm. Every update arrives
# as a pull request and is reviewed like any other change (CI must be green).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Types must match the Node runtime in package.json "engines" (Node 22).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the compiler API that typescript-eslint and
      # @astrojs/check (astro check) build on; with 7.0.2 both abort, so lint
      # and typecheck would stop working. Minor/patch updates of TypeScript 6
      # still arrive. Remove this entry once typescript-eslint and
      # @astrojs/check officially support TypeScript 7 in their peer ranges.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Batch minor/patch updates of development tools into one PR.
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
