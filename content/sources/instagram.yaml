- id: instagram-help-activity-other-businesses
  title: Anpassen, welche Inhalte dir auf Instagram basierend auf deinen Aktivitäten bei anderen Unternehmen angezeigt werden
  publisher: Instagram-Hilfebereich
  url: https://help.instagram.com/2885653514995517
  tier: 1
  type: help-center
  retrievedAt: "2026-10-07"
  region: global
  language: de
  note: "Gerendert (de-DE, US-Netz). Schritte in der App: Profil > Menü > Kontenübersicht > Deine Informationen und Berechtigungen > Aktivitäten bei anderen Unternehmen. Beschreibt die Einstellung für relevante Inhalte; ein Abschnitt zu Werbung und ein Hinweis zur Region Europa fehlen in dieser Fassung."
- id: instagram-help-manage-ad-experience
  title: Verwalten, ob du mehr oder weniger stark personalisierte Werbung sehen möchtest
  publisher: Instagram-Hilfebereich
  url: https://help.instagram.com/426488546963771
  tier: 1
  type: help-center
  retrievedAt: "2026-10-21"
  region: EU
  language: de
  note: "Gerendert (de-DE und en-GB, US-Netz) in den Ansichten Android, iPhone und Computer. „Diese Option ist nur in der Region Europa verfügbar.“ App: Profilbild > Menü > Kontenübersicht > Werbepräferenzen > Tab „Informationen verwalten“ > Werbeerlebnis > Bestätigen. Computer: Mehr > Einstellungen > Kontenübersicht > Werbepräferenzen > Informationen verwalten > Werbeerlebnis. Englische Fassung nennt „Meta Account“ statt Kontenübersicht."
