  note: "„… lädt LinkedIn Ihre Adressbuchkontakte und deren genaue Kontaktinformationen einmalig hoch. Danach können wir in regelmäßigen Abständen Details über Ihre Kontakte importieren und speichern …“; „Wir verwenden die Importdaten Ihrer Kontakte nicht für das Training allgemeiner KI-Modelle.“"
- id: linkedin-help-delete-imported-contacts
  title: Importierte Adressbuchkontakte von LinkedIn löschen
  publisher: LinkedIn Hilfe
  url: https://www.linkedin.com/help/linkedin/answer/a563126?lang=de
  tier: 1
  type: help-center
  retrievedAt: "2026-10-08"
  region: global
  language: de
  note: "Schritte Desktop und Mobilgerät über Einstellungen & Datenschutz > Synchronisierungsoptionen > Kontakte synchronisieren > Alle entfernen. „Deine Kontakte werden sofort gelöscht. Aktualisierungen von Vorschlägen können bis zu 72 Stunden dauern.“ Teils maschinell übersetzt."
- id: linkedin-help-private-mode
  title: Profile im privaten und halbprivaten Modus durchsuchen
  publisher: LinkedIn Hilfe
  url: https://www.linkedin.com/help/linkedin/answer/a567226?lang=de
  tier: 1
  type: help-center
  retrievedAt: "2026-10-08"
  region: global
  language: de
  note: "Drei Modi: Name und Profil-Slogan, Private Profileigenschaften, Privatmodus. Schritte über Einstellungen & Datenschutz > Sichtbarkeit. Premium sieht Profilbesucher der letzten 90 Tage, aber keine Namen von Besucher*innen im Privatmodus."
- id: linkedin-help-demographics
  title: Wie LinkedIn Ihre persönlichen demografischen Daten verwendet
  publisher: LinkedIn Hilfe
  url: https://www.linkedin.com/help/linkedin/answer/a1336543?lang=de
  tier: 1
  type: help-center
  retrievedAt: "2026-10-08"
  region: global
  language: de
  note: "Freiwillige Angaben zu u. a. Geschlecht, ethnischer Zugehörigkeit; „Wir erlauben kein Anzeigen-Targeting auf der Grundlage von ethnischer Zugehörigkeit, Behinderungen oder anderen sensiblen Merkmalen.“ Alter und Geschlecht (abgeleitet oder angegeben) werden für Werbung genutzt."
- id: linkedin-dpc-fine-2024
  title: Irish Data Protection Commission fines LinkedIn Ireland €310 million
  publisher: Data Protection Commission (Irland)
  url: https://www.dataprotection.ie/en/news-media/press-releases/irish-data-protection-commission-fines-linkedin-ireland-eu310-million
  tier: 1
  type: regulator
  retrievedAt: "2026-10-08"
  region: EU
  language: en
  note: "24. Oktober 2024: Verwarnung, Anordnung und Geldbußen von insgesamt 310 Mio. € wegen Verarbeitung für „behavioural analysis and targeted advertising“; Einwilligung für Daten von Dritten „not freely given, sufficiently informed or specific, or unambiguous“; Verstöße gegen Art. 5, 6, 13, 14 DSGVO."
- id: linkedin-dpc-ai-statement-2025
  title: DPC statement on LinkedIn AI Training
  publisher: Data Protection Commission (Irland)
  url: https://dataprotection.ie/en/news-media/latest-news/dpc-statement-linkedin-ai-training
  tier: 1
  type: regulator
  retrievedAt: "2026-10-08"
  region: EU
  language: en
  note: "7. November 2025: LinkedIn verringerte nach Empfehlungen der DPC den Umfang der Trainingsdaten, auch beim Zeitraum; Widerspruch per Schalter in den Einstellungen oder per Formular. „The DPC has not approved, or found compliant, LinkedIn’s use of users’ personal data for generative AI model training.“"
- id: linkedin-ap-ai-warning-2025
  title: AP bezorgd over AI-training LinkedIn en roept gebruikers op om instellingen aan te passen
  publisher: Autoriteit Persoonsgegevens (Niederlande)
  url: https://www.autoriteitpersoonsgegevens.nl/actueel/ap-bezorgd-over-ai-training-linkedin-en-roept-gebruikers-op-om-instellingen-aan-te-passen
  tier: 1
  type: regulator
  retrievedAt: "2026-10-08"
  region: EU
  language: nl
  note: "24. September 2025: „De instelling ‚Gegevens voor verbetering van generatieve AI‘ staat standaard aan.“ Daten, die einmal im Modell sind, seien „er niet zomaar meer uit te halen“. Nennt den Weg ‚Instellingen & Privacy → Gegevensprivacy → Gegevens voor verbetering van generatieve AI‘ (niederländische Oberfläche)."
