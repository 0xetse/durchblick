- id: linkedin-privacy-policy
  title: LinkedIn Datenschutzrichtlinie
  publisher: LinkedIn
  url: https://de.linkedin.com/legal/privacy-policy
  tier: 1
  type: privacy-policy
  retrievedAt: "2026-10-08"
  region: global
  language: de
