- id: telegram-green-encryption
  title: Is Telegram really an encrypted messaging app?
  publisher: Matthew Green (Kryptograf, Johns Hopkins University), Blog „A Few Thoughts on Cryptographic Engineering“
  url: https://blog.cryptographyengineering.com/2024/08/25/telegram-is-not-really-an-encrypted-messaging-app/
  tier: 2
  type: research
  retrievedAt: "2026-10-08"
  region: global
  language: en
  note: "25. August 2024. „it does not end-to-end encrypt conversations by default“; Ende-zu-Ende-Verschlüsselung „never for group chats with more than two people in them“."
- id: telegram-engadget-law-enforcement
  title: Telegram will now provide IP addresses and phone numbers in response to legal requests
  publisher: Engadget
  url: https://www.engadget.com/apps/telegram-will-now-provide-ip-addresses-and-phone-numbers-in-response-to-legal-requests-170300911.html
  tier: 2
  type: journalism
  retrievedAt: "2026-10-08"
  region: global
  language: en
  note: "Jeremy Gan, 23. September 2024. Sinngemäß: Laut Pavel Durov gibt Telegram künftig IP-Adressen und Telefonnummern von Nutzer*innen heraus, wenn rechtliche Anfragen dies verlangen (der Artikel stützt sich auf einen Bloomberg-Bericht); Kontext: Festnahme von Pavel Durov in Frankreich im August 2024."
- id: telegram-techcrunch-transparency
  title: Telegram reports spike in sharing user data with law enforcement
  publisher: TechCrunch
  url: https://techcrunch.com/2025/01/07/telegram-reports-spike-in-sharing-user-data-with-law-enforcement/
  tier: 2
  type: journalism
  retrievedAt: "2026-10-08"
  region: global
  language: en
  note: "Zack Whittaker, 7. Januar 2025. Zahlen für 2024 aus Telegrams Transparenzbericht: USA 900 Fälle (2.253 Nutzer*innen), Indien 14.641 Fälle (23.535), Vereinigtes Königreich 142 Fälle (293). Sinngemäß: Der Bericht lässt sich nur mit einem Telegram-Konto abrufen und zeigt nur Zahlen für die Region, in der man sich befindet."
