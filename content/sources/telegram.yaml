# Telegram-specific sources.
- id: telegram-privacy-policy
  title: Telegram Datenschutzerklärung
  publisher: Telegram Messenger Inc.
  url: https://telegram.org/privacy/de
  tier: 1
  type: privacy-policy
  retrievedAt: "2026-10-08"
  region: global
  language: de
  note: "Deutsche Fassung, letzte Änderung laut Änderungsprotokoll (Abschnitt 11) am 21. August 2026. Gilt weltweit; Abschnitt 1.4 regelt den EWR (Verantwortlicher Telegram Messenger Inc., Britische Jungferninseln; EWR-Vertreter EDPO in Brüssel). Auch unter https://telegram.org/privacy wurde uns beim Abruf die deutsche Fassung ausgeliefert."
- id: telegram-faq
  title: Telegram FAQ
  publisher: Telegram
  url: https://telegram.org/faq
  tier: 1
  type: help-center
  retrievedAt: "2026-10-08"
  region: global
  language: en
  note: "Englische Fassung. Genutzt u. a. für „Q: So how do you encrypt data?“, „Q: Why not just make all chats 'secret'?“, „Q: How are you going to make money out of this?“, „Q: Do Telegram's AI features upload data to third parties?“ und „Q: Do you process data requests?“."
- id: telegram-faq-de
  title: Telegram – Fragen und Antworten
  publisher: Telegram
  url: https://telegram.org/faq/de
  tier: 1
  type: help-center
  retrievedAt: "2026-10-08"
  region: global
  language: de
  note: "Deutsche Fassung der FAQ mit deutschen Menünamen, u. a. „Einstellungen → Privatsphäre und Sicherheit → Telefonnummer“, „Geheimen Chat starten“, „Synchronisierte Kontakte löschen“, „Vorschläge für häufige Kontakte“. Abweichung zur englischen Fassung: Unter „Reagiert ihr auf Datenanfragen?“ steht „0 Byte Nutzerdaten“, englisch „0 bytes of user messages“."
- id: telegram-durov-e2e-default
  title: "Why Isn't Telegram End-to-End Encrypted by Default?"
  publisher: Pavel Durov (Gründer und CEO von Telegram) auf Telegraph
  url: https://telegra.ph/Why-Isnt-Telegram-End-to-End-Encrypted-by-Default-08-14
  tier: 1
  type: official-docs
  retrievedAt: "2026-10-08"
  region: global
  language: en
  note: "Beitrag vom 14. August 2017, verlinkt aus der offiziellen Telegram-FAQ („See also: Why Telegram isn't End-to-End Encrypted ‚by Default‘“). „in cloud chats our servers do have access to the encryption key“."
- id: telegram-blog-export
  title: Chat Export Tool, Better Notifications and More
  publisher: Telegram-Blog
  url: https://telegram.org/blog/export-and-more
  tier: 1
  type: official-docs
  retrievedAt: "2026-10-08"
  region: global
  language: en
  note: "Beitrag vom 27. August 2018: „make sure you have the latest version of Telegram Desktop installed on your computer, then click Settings > Export Telegram data“. Export als JSON oder HTML. Der Menüpfad ist acht Jahre alt und nicht neu geprüft."
- id: telegram-core-export
  title: Telegram Data Export Schema
  publisher: Telegram
  url: https://core.telegram.org/import-export
  tier: 1
  type: official-docs
  retrievedAt: "2026-10-21"
  region: global
  language: en
  note: "Offizielle Telegram-Dokumentation ohne Datum. „make sure you have Telegram Desktop installed on your computer, then click Settings > Advanced > Export Telegram data“. Export „in JSON or in human-readable HTML“; Startdatei „export_results.html“, beim Export eines einzelnen Chats „messages.html“."
