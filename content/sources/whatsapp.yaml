  region: global
  language: de
  note: "„Du kannst dein WhatsApp-Konto jederzeit in deinen WhatsApp-Einstellungen aus einer Kontenübersicht entfernen. Wir beenden die Weitergabe deiner Informationen innerhalb von 24 Stunden …“; Entfernen kopierter Verknüpfungen „kann bis zu sieben Tage dauern“. Nicht regionsspezifisch; die EWR-Ergänzungsrichtlinie nennt für die Löschung 90 Tage – der Guide folgt weiter der EWR-Fassung."
