- id: whatsapp-help-meta-account
  title: WhatsApp in deinem Meta-Konto verwalten
  publisher: WhatsApp-Hilfebereich
  url: https://faq.whatsapp.com/519792767655150/
  tier: 1
  type: help-center
  retrievedAt: "2026-10-21"
  region: global
  language: de
  note: "Gerendert (de-DE und en-US, US-Netz) in der Android- und iOS-Ansicht; der Abschnitt zum Entfernen ist in beiden gleich: „Tippe auf [Symbol] > Einstellungen > Meta-Konto > Konto verwalten. Tippe neben „WhatsApp“ auf Verwalten > Aus diesem Meta-Konto entfernen. Tippe auf Ja, fortfahren > Weiter > Ja, jetzt verschieben.“ Hinweis im Artikel: Die Kontenübersicht wird schrittweise in „Meta-Konto“ umbenannt. Englisch: „Settings > Meta Account > Manage account … Manage > Move out of this Meta Account … Yes, continue > Continue > Yes, finish moving“. Ziel des Links „WhatsApp-Konto der Kontenübersicht hinzufügen oder daraus entfernen“ im Artikel 849367647393371."
