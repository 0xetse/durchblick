- id: snapchat-help-privacy-settings
  title: "Wie ändere ich meine Datenschutzeinstellungen auf Snapchat?"
  publisher: Snapchat Support
  url: https://help.snapchat.com/hc/de/articles/7012343074580
  tier: 1
  type: help-center
  retrievedAt: "2026-10-08"
  region: global
  language: de
  note: "„Standardmäßig können dich nur Freunde, die du auf Snapchat hinzugefügt hast, direkt kontaktieren oder deine Story anschauen.“ Einstellungen unter „App & Datenschutz“, u. a. „Wer mich in „Freunde finden“ sehen kann“ (Änderung wirkt nach bis zu 72 Stunden)."
- id: snapchat-help-rank-discover
  title: "So bewerten wir Content in Entdecken"
  publisher: Snapchat Support
  url: https://help.snapchat.com/hc/de/articles/8961631424020
  tier: 1
  type: help-center
  retrievedAt: "2026-10-21"
  region: EU
  language: de
  note: "Für EWR, UK und Schweiz: „In Entdecken und Spotlight kannst du personalisierte Inhalte deaktivieren“ über „…“ und „Warum sehe ich diesen Inhalt?“; „Oder du gehst direkt zu den Einstellungen und wählst dort die Option ‚Personalisierungskontrollen‘.“ Danach Empfehlungen nur nach Sprache, Alter und Land. „Es kann zu Verzögerungen kommen, bevor sich die Inhalte ändern.“"
- id: snapchat-help-rank-spotlight
  title: "So ranken wir Inhalte in Spotlight"
  publisher: Snapchat Support
  url: https://help.snapchat.com/hc/de/articles/8961653169940
  tier: 1
  type: help-center
  retrievedAt: "2026-10-21"
  region: EU
  language: de
  note: "Gleicher Weg wie für Entdecken: „…“ → „Warum sehe ich diesen Inhalt?“ oder Einstellungen → „Personalisierungskontrollen“. Wieder einschalten über das Favorit-Symbol oder „Einstellungen für personalisierte Inhalte“."
