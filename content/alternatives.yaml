- id: ai-assistant
  title: KI-Assistent
  einordnung: Was man einem Chatbot schreibt, ist oft sehr persönlich. Bei ChatGPT können Gespräche standardmäßig
    zum Training genutzt werden (abschaltbar), in der kostenlosen und der Go-Stufe zeigt OpenAI inzwischen Werbung.
    Duck.ai anonymisiert Anfragen, Lumo verschlüsselt den Verlauf so, dass Proton ihn nicht lesen kann, und lokale
    Modelle schicken gar nichts ins Netz. Bei Antwortqualität und Funktionen wie Sprache oder Dateien liegen die
    großen Anbieter oft vorn.
  withoutSwitching: In den ChatGPT-Einstellungen die Option „Das Modell für alle verbessern“ ausschalten. Für heikle
    Themen temporäre Chats nutzen. Prüfe, was sich ChatGPT über dich gemerkt hat (Memory), und schalte das bei Bedarf
    ab. Werbung zeigt OpenAI nur in Free und Go; in der EU ist sie laut OpenAI vorerst nicht personalisiert. Gesundheits-, Ausweis- oder Finanzdaten gehören grundsätzlich nicht in einen Chatbot.
  incumbent:
    id: chatgpt
    name: ChatGPT
    provider: OpenAI (für EU-Nutzer OpenAI Ireland Ltd.)
    jurisdiction: USA
    businessModel: 'Abos (Go, Plus, Pro, Business) und Werbung in den Stufen Free und Go, seit 2026 auch in Europa.'
    price: 'Kostenlos; Go 8 USD, Plus 20 USD im Monat (in manchen Ländern lokal angepasst).'
    openSource: 'no'
    encryption: Verbindung verschlüsselt (HTTPS); Verlauf beim Anbieter gespeichert, keine Ende-zu-Ende-Verschlüsselung
      (der Anbieter kann also mitlesen).
    dataCollection: 'Gespräche können bei Privatkonten standardmäßig zur Modellverbesserung genutzt werden; du kannst das abschalten oder temporäre Chats nutzen. Werbung ist in der EU laut OpenAI vorerst nicht personalisiert, richtet sich aber nach dem aktuellen Chat.'
    strengths:
    - 'Viele Funktionen (Bilder, Sprache, Dateien, Recherche).'
    - 'Weit verbreitet, viele Integrationen.'
    tradeOffs:
    - 'Training mit Gesprächen ist voreingestellt; du musst es selbst abschalten.'
