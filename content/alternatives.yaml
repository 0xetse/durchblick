    „Datenschutz“ festlegen, wer Profilbild, Info, „Zuletzt online“ und Status sieht und wer dich zu Gruppen hinzufügen
    darf. In den Handy-Einstellungen den Kontaktzugriff prüfen und WhatsApp aus der Meta-Kontenübersicht entfernen.
    Die Begleitdaten bei Meta bleiben jedoch bestehen.
