# Alternativen je Kategorie – neutrale Abwägung, keine Empfehlung „gut/schlecht“.
# Leitlinie (V2): Zuerst zeigen, was ohne Wechsel geht. Bei jeder Alternative konkret benennen, auf welchen
# Komfort man im Alltag in Deutschland verzichtet oder was man gewinnt („Verzichtest du auf“, „Gewinnst du“,
# „Bleibt gleich“). Quellen-IDs verweisen auf content/sources/alternatives.yaml.
- id: browser
  title: Browser
  einordnung: 'Der Browser sieht alles, was du im Netz tust – deshalb wirkt ein Wechsel breit: Firefox, Brave und
    Safari blockieren Tracker von Haus aus stärker als Chrome. Tracker sind Code-Schnipsel, die dich über Websites
    hinweg verfolgen. Chrome lässt außerdem Cookies fremder Firmen (Drittanbieter-Cookies) weiterhin standardmäßig zu. Wer ohnehin fast nur eingeloggt in Google-Diensten arbeitet, gewinnt durch einen Browserwechsel allein
    weniger und verliert etwas Bequemlichkeit bei der Google-Anmeldung.'
  withoutSwitching: 'In Chrome unter „Einstellungen“ → „Datenschutz und Sicherheit“ Cookies fremder Firmen (Drittanbieter-Cookies) blockieren.
    Bei der Synchronisierung nur die Daten auswählen, die du wirklich brauchst. Im Google-Konto „Web- & App-Aktivitäten“
    (dazu gehört der Chrome-Verlauf) pausieren oder automatisch löschen lassen und in den Chrome-Einstellungen eine
    andere Standardsuchmaschine wählen. Das schließt nicht alle Lücken, verringert aber spürbar, dass Firmen dich über Webseiten
    hinweg verfolgen.'
  incumbent:
    id: google-chrome
    name: Google Chrome
    provider: Google LLC
    jurisdiction: USA
    businessModel: Kostenlos; Chrome stärkt Googles Werbe- und Suchgeschäft, das Google den größten Teil seines
      Umsatzes bringt.
    price: Kostenlos.
    openSource: partial
    encryption: Verschlüsselte Verbindungen (HTTPS) wie alle Browser; synchronisierte Daten sind standardmäßig mit
      Google-Schlüsseln geschützt, optional mit eigener Passphrase.
    dataCollection: Bei Anmeldung und aktivierter Synchronisierung können Verlauf und Aktivitäten im Google-Konto
      landen; Cookies fremder Firmen (Drittanbieter-Cookies) bleiben standardmäßig erlaubt, nachdem Google 2025 von der Abschaffung abgerückt
      ist.
    strengths:
    - Sehr verbreitet, beste Kompatibilität mit Webseiten.
    - Schnelle Sicherheitsupdates.
    - Nahtlos mit Google-Konto auf allen Geräten (Lesezeichen, Passwörter, Tabs).
    - Größte Auswahl an Erweiterungen (Chrome Web Store).
    tradeOffs:
    - Weniger eingebauter Schutz davor, dass Firmen dich über Websites hinweg verfolgen, als bei den Alternativen.
    - Mit Anmeldung landen Verlauf und Aktivitäten standardmäßig im Google-Konto, wenn du es nicht änderst.
    switchingEffort: low
    switchingNote: Bereits weit verbreitet – hier geht es um Einstellungen, nicht um einen Wechsel.
    url: https://www.google.com/chrome/
    sources:
    - alt-windowsreport-privacy-sandbox
    - alt-engadget-privacy-sandbox
    - alt-chromium-source
    needsVerification: false
  alternatives:
