    name: Firefox
    provider: Mozilla Corporation (Tochter der Mozilla Foundation)
    jurisdiction: USA
    businessModel: Vor allem Umsatzbeteiligung aus Suchmaschinen-Verträgen (2024 laut Berichten rund 85 % des Umsatzes
      über Google), dazu Werbung auf der Neuer-Tab-Seite.
    price: Kostenlos.
    openSource: 'yes'
    encryption: 'Firefox-Sync ist Ende-zu-Ende-verschlüsselt (an das Konto-Passwort gebunden): Nur deine eigenen Geräte
      können die Daten lesen, Mozilla nicht.'
    dataCollection: Sendet standardmäßig technische und Nutzungsdaten an Mozilla (abschaltbar); zeigt gesponserte
      Inhalte auf der Neuer-Tab-Seite (abschaltbar).
    strengths:
    - Eigene Browser-Engine, nicht von Chromium abhängig.
    - Erweiterter Schutz davor, dass Firmen dich über Websites verfolgen (Tracking-Schutz), standardmäßig aktiv.
    - Viele Erweiterungen, auch auf Android.
    tradeOffs:
    - 'Verzichtest du auf: Chrome-Erweiterungen direkt aus dem Chrome Web Store. Firefox hat einen eigenen Katalog;
      viele bekannte Erweiterungen gibt es dort auch, aber nicht alle.'
    - 'Verzichtest du auf: die automatische Verbindung mit deinem Google-Konto. Lesezeichen, Passwörter und Tabs
      synchronisierst du über ein eigenes Mozilla-Konto. In Gmail, YouTube & Co. meldest du dich ganz normal an.'
    - 'Verzichtest du auf: volle Sicherheit, dass jede Seite läuft. Seiten, die nur für Chrome getestet sind, machen
