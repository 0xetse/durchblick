- id: search
  title: Suche
  einordnung: Suchanfragen verraten viel über Gesundheit, Pläne und Sorgen. Die Alternativen verknüpfen Suchen nicht
    mit einem Konto oder Profil, zeigen aber weiterhin Werbung – nur passend zur Suche statt zu deinem Profil. Bei
    lokalen Fragen (Öffnungszeiten, Geschäfte in der Nähe, Fahrpläne) und beim Einkaufen bietet Google in Deutschland
    meist mehr direkte Antworten.
  withoutSwitching: Im Google-Konto unter „Daten und Datenschutz“ die „Web- & App-Aktivitäten“ pausieren oder auf
    „Automatisch löschen“ stellen und in „Mein Anzeigen-Center“ personalisierte Werbung ausschalten. In den Sucheinstellungen
    lassen sich zusätzlich personalisierte Suchergebnisse abschalten, oder du suchst abgemeldet. Damit entsteht deutlich
    weniger Suchprofil, Google sieht die einzelnen Anfragen aber weiterhin.
  incumbent:
    id: google-search
    name: Google Suche
    provider: Google LLC
    jurisdiction: USA
    businessModel: Suchwerbung – Googles größte Einnahmequelle.
    price: Kostenlos.
    openSource: 'no'
    encryption: Verbindung verschlüsselt (HTTPS); der Anbieter kann deine Suchen lesen – bei Suche ist das üblich.
    dataCollection: Suchen können bei Anmeldung in „Web- & App-Aktivitäten“ gespeichert und für Personalisierung
      und Werbung genutzt werden; Einstellungen erlauben Pausieren und automatisches Löschen.
    strengths:
    - Größter Index, sehr gute lokale Ergebnisse.
    - Viele Direktantworten (Karten, Fahrpläne, Öffnungszeiten, Bewertungen).
    - Bildersuche und Preisvergleiche (Shopping) direkt in den Ergebnissen.
    tradeOffs:
    - Personalisierung basiert auf Nutzungsdaten, solange du sie nicht abschaltest.
    - Anzeigen und Googles eigene Dienste stehen oft oben in den Ergebnissen.
    switchingEffort: low
    switchingNote: Bereits weit verbreitet – hier geht es um Einstellungen, nicht um einen Wechsel.
    url: https://www.google.com/
    sources:
