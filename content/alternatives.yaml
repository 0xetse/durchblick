- id: email
  title: E-Mail
  einordnung: Bei Gmail kann Google den Inhalt deiner Mails technisch lesen (etwa für Spamfilter und Funktionen),
    nutzt ihn laut eigener Aussage aber nicht für Werbung. Proton und Tuta verschlüsseln gespeicherte Mails so,
    dass der Anbieter sie nicht lesen kann; Posteo und mailbox.org bieten das optional. Mails an Menschen mit Gmail
    oder anderen Diensten sind meist nur auf dem Transportweg verschlüsselt – der Empfänger-Anbieter sieht sie trotzdem.
    Der größte Aufwand beim Wechsel ist die neue Adresse, nicht die Technik.
  withoutSwitching: Im Google-Konto die Bestätigung in zwei Schritten aktivieren und in „Mein Anzeigen-Center“ personalisierte
    Werbung ausschalten. In den Gmail-Einstellungen kannst du „Intelligente Funktionen“ abschalten, wenn du Vorschläge
    und automatische Sortierung nicht brauchst. Am Grundsatz, dass Google Inhalte technisch lesen kann, ändert das
    nichts.
  incumbent:
    id: gmail
    name: Gmail
    provider: Google LLC (für EU-Nutzer Google Ireland Ltd.)
    jurisdiction: USA
    businessModel: Werbung (personalisiert über die Google-Kontoaktivität) und Speicher-Abos (Google One) bzw. Workspace.
    price: Kostenlos mit 15 GB (geteilt mit Drive und Fotos); mehr Speicher über Google One; eigene Domain nur mit
      dem kostenpflichtigen Google Workspace.
    openSource: 'no'
    encryption: Verschlüsselt auf dem Weg (TLS, sofern der andere Mail-Anbieter mitmacht) und auf Googles Rechnern, aber
      mit Google-Schlüsseln. Für Privatkunden
      gibt es standardmäßig keine Ende-zu-Ende-Verschlüsselung, bei der nur Absender und Empfänger mitlesen können.
    dataCollection: Google gibt an, Gmail-Inhalte nicht für Werbung zu scannen; Anzeigen in Gmail basieren auf deiner
      sonstigen Aktivität im Google-Konto (abschaltbar).
    strengths:
    - Eingebauter Spamfilter, automatische Sortierung und Suche.
    - Tiefe Integration mit Kalender, Kontakten, Drive und Android.
    - Kostenlos mit 15 GB Speicher.
    tradeOffs:
    - Anbieter kann Inhalte technisch lesen und verarbeitet sie für Funktionen wie Spamfilter und Sortierung.
    - Werbung im Posteingang (Tabs „Werbung“ und „Soziale Netzwerke“).
