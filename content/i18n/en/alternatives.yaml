- id: search
  title: "Search"
  einordnung: "Searches reveal a lot about your health, plans and worries. The alternatives do not link searches to an account or profile, but they still show ads – matched to the search instead of to your profile. For local questions (opening hours, shops nearby, timetables) and for shopping, Google in Germany usually gives more direct answers."
  withoutSwitching: "In your Google Account under “Data & privacy”, pause “Web & App Activity” or set it to “Auto-delete”, and turn off personalised ads in “My Ad Center”. In the search settings you can also turn off personalised search results, or you can search while signed out. This creates a much smaller search profile, but Google still sees each individual search."
