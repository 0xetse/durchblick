# Alternatives per category – neutral weighing-up, no "good/bad" recommendation.
# Guideline (V2): First show what is possible without switching. For each alternative, name concretely which
# everyday convenience in Germany you give up or what you gain ("You give up", "You gain",
# "Stays the same"). Source IDs refer to content/sources/alternatives.yaml.
- id: browser
  title: "Browser"
  einordnung: "Your browser sees everything you do online – so switching has a broad effect: Firefox, Brave and Safari block trackers more strongly than Chrome out of the box. Trackers are snippets of code that follow you across websites. Chrome also still allows cookies from other companies (third-party cookies) by default. If you work almost only while signed in to Google services anyway, switching browsers alone gains you less and costs you some convenience when signing in to Google."
  withoutSwitching: "In Chrome, go to “Settings” → “Privacy and security” and block cookies from other companies (third-party cookies). For sync, choose only the data you really need. In your Google Account, pause “Web & App Activity” (this includes your Chrome history) or set it to delete automatically, and choose a different default search engine in Chrome’s settings. This does not close every gap, but it noticeably reduces how much companies can follow you across websites."
  incumbent:
    id: google-chrome
    name: Google Chrome
    provider: Google LLC
    jurisdiction: "USA"
    businessModel: "Free; Chrome strengthens Google’s advertising and search business, which brings in most of Google’s revenue."
    price: "Free."
    openSource: partial
    encryption: "Encrypted connections (HTTPS) like all browsers; synced data is protected with Google’s keys by default, optionally with your own passphrase."
    dataCollection: "If you are signed in and sync is on, your history and activity can end up in your Google Account; cookies from other companies (third-party cookies) stay allowed by default after Google backed away from phasing them out in 2025."
    strengths:
    - "Very widely used, best compatibility with websites."
    - "Fast security updates."
    - "Seamless with your Google Account on all devices (bookmarks, passwords, tabs)."
    - "Largest choice of extensions (Chrome Web Store)."
    tradeOffs:
    - "Less built-in protection against companies following you across websites than the alternatives."
    - "When you are signed in, your history and activity end up in your Google Account by default unless you change it."
    switchingEffort: low
    switchingNote: "Already very widely used – this is about settings, not about switching."
    url: https://www.google.com/chrome/
    sources:
    - alt-windowsreport-privacy-sandbox
    - alt-engadget-privacy-sandbox
    - alt-chromium-source
    needsVerification: false
  alternatives:
