- id: cloud
  title: "Cloud storage"
  einordnung: "With Google Drive, and by default also with iCloud, the provider holds the keys – it could technically view files or hand them over on request. Proton Drive and Tresorit encrypt end-to-end, so the provider cannot read along; with hosted Nextcloud the main gain is the location, and you have to turn on encryption deliberately. If you work together in Google Docs a lot or use Google Photos, you will lose noticeable convenience when switching."
  withoutSwitching: "On your iPhone, go to “Settings” → your name → “iCloud” and turn on “Advanced Data Protection” – then Drive, Photos and backups are end-to-end encrypted. Google Drive has no comparable option for private customers. There, check shares set to “Anyone with the link” and turn on 2-Step Verification. You can encrypt very sensitive files yourself before uploading them."
