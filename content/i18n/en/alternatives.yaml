- id: messaging
  title: "Messaging"
  einordnung: "WhatsApp already encrypts message content end-to-end with the Signal Protocol. This means only the sender and recipient can read along. So switching changes little about the content. The difference lies in the accompanying data (who writes to whom and when, address book, profile) and the link to Meta. In Germany, most of your contacts use WhatsApp. That is why it is often more realistic to use an alternative as well."
  withoutSwitching: "In WhatsApp, go to “Chats” → “Chat backup” and turn on the end-to-end encrypted backup. Under “Privacy”, choose who sees your profile photo, About, “Last seen” and status, and who can add you to groups. In your phone’s settings, check contact access and remove WhatsApp from Meta’s Accounts Center. The accompanying data at Meta remains, however."
