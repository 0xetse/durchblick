- id: email
  title: "Email"
  einordnung: "With Gmail, Google can technically read the content of your emails (for example for spam filters and features), but according to the company it does not use it for advertising. Proton and Tuta encrypt stored emails so that the provider cannot read them; Posteo and mailbox.org offer this as an option. Emails to people using Gmail or other services are usually only encrypted in transit – the recipient’s provider can still see them. The biggest effort when switching is the new address, not the technology."
  withoutSwitching: "In your Google Account, turn on 2-Step Verification and turn off personalised ads in “My Ad Center”. In Gmail’s settings you can turn off “Smart features” if you do not need suggestions and automatic sorting. This does not change the basic fact that Google can technically read content."
  incumbent:
    id: gmail
    name: Gmail
    provider: "Google LLC (for EU users Google Ireland Ltd.)"
    jurisdiction: "USA"
    businessModel: "Advertising (personalised through your Google Account activity) and storage subscriptions (Google One) or Workspace."
    price: "Free with 15 GB (shared with Drive and Photos); more storage via Google One; your own domain only with the paid Google Workspace."
    openSource: 'no'
    encryption: "Encrypted in transit (TLS, as long as the other email provider supports it) and on Google’s computers, but with Google’s keys. For private customers there is no end-to-end encryption by default, where only the sender and recipient can read along."
    dataCollection: "Google states that it does not scan Gmail content for advertising; ads in Gmail are based on your other activity in your Google Account (can be turned off)."
    strengths:
    - "Built-in spam filter, automatic sorting and search."
    - "Deep integration with Calendar, Contacts, Drive and Android."
    - "Free with 15 GB of storage."
    tradeOffs:
    - "The provider can technically read content and processes it for features such as the spam filter and sorting."
    - "Ads in the inbox (“Promotions” and “Social” tabs)."
    switchingEffort: low
    switchingNote: "Already very widely used – this is about settings, not about switching."
