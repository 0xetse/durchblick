id: instagram
name: Instagram
company: meta
category: social
url: https://www.instagram.com/
summary: "Instagram analyses which photos, reels and accounts you look at. It uses this for your feed and for ads, together with data from other websites and apps. The same privacy policy applies as for Facebook."
surprise:
  action: instagram-contacts
  text: "If you turn off contact syncing, the contacts already uploaded stay stored. You can only delete them all at once, on a computer. After that, Instagram can still make suggestions based on your contacts for up to 90 days."
  sources:
    - ref: instagram-help-contacts
      note: "„Wenn du das Synchronisieren der Kontakte deaktivierst, werden dadurch keine zuvor synchronisierten Kontakte gelöscht“; „Du kannst keine einzelnen Kontakte von Instagram löschen“; bis zu 90 Tage"
businessModel:
  text: "Like Facebook, Instagram is funded by ads. Meta makes almost all of its revenue from ads on Facebook, Instagram, Messenger and partner apps. In the EU, there is also an ad-free subscription."
  sources:
    - ref: meta-sec-10q-2026-q2
      note: "„Our advertising revenue is generated by displaying ad products on Facebook, Instagram, Messenger, and third-party mobile applications.“"
    - meta-help-ads-subscription
dataPoints:
  - id: ig-profile
    category: account
    title: "You give Instagram information about yourself."
    detail: "For example, your username, name, contact details and optional profile information such as a profile photo or bio. Meta also uses your age, the gender you have entered and your location for ads."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt „Welche Informationen erheben wir?“"
      - ref: meta-help-manage-ad-experience
        note: "Profilinformationen wie Alter, angegebenes Geschlecht, Standort"
  - id: ig-content
    category: content
    title: "Instagram stores your photos, videos, stories and reels."
    detail: "Also captions, comments, hashtags, audio and content from the camera feature. As well as accompanying data such as when or where something was taken."
    technical: "Meta calls this accompanying data “metadata about content and messages”."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Inhalte, die du erstellst, wie Beiträge, Kommentare oder Audio“; „Inhalte, die du über unsere Kamerafunktion … bereitstellst“; „Hashtags“"
  - id: ig-messages
    category: communications
    title: "Meta can also process direct messages – as far as the law allows."
    detail: "The policy lists messages “including their content, subject to applicable law”, for example for running the service and for safety. To tailor content and ads to you, Meta only mentions accompanying data about messages."
    technical: "For personalisation, the policy only lists “metadata about … messages”. According to Instagram Help, end-to-end encrypted messages on Instagram have no longer been supported since 8 May 2026; for encrypted chats, Meta points to WhatsApp."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt „Warum und wie wir deine Informationen verarbeiten“"
      - ref: instagram-help-e2ee
        note: "„Ende-zu-Ende-verschlüsselte Nachrichten auf Instagram werden seit dem 8. Mai 2026 nicht mehr unterstützt.“"
  - id: ig-activity
    category: activity
    title: "Instagram records what you look at and for how long."
    detail: "Which reels, posts and profiles you view, like, save or skip. And when, how often and for how long you use the app. Your feed, Reels and Explore are based on this."
    provenance: observed
    mechanisms: [usage]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Die Arten von Inhalten, die du dir ansiehst bzw. mit denen du interagierst“; „Zeitpunkt, Häufigkeit und Dauer deiner Aktivitäten“"
      - ref: meta-help-manage-ad-experience
        note: "EU-Hilfeartikel, Liste „Personalisierte Werbung“: „Die Inhalte, die du dir in unseren Produkten ansiehst bzw. mit denen du interagierst“"
  - id: ig-ad-interactions
    category: activity
    title: "Instagram remembers how you respond to ads."
    detail: "Clicks, likes and other reactions to ads. This also applies with less personalised ads."
    provenance: observed
    mechanisms: [usage]
    evidence: stated
    sources:
      - ref: meta-help-less-personalised-ads
        note: "„Deine Interaktionen mit Werbeanzeigen wie etwa Anklicken oder ‚Gefällt mir‘-Angaben“"
  - id: ig-connections
    category: contacts
    title: "Instagram knows your followers and the accounts you follow."
    detail: "Who you follow, who follows you, who you message. Others can tag you or share your content."
    provenance: provided
    mechanisms: [provided, other-users]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Freund*innen, Abonnent*innen und andere Kontakte“"
  - id: ig-contact-sync
    category: contacts
    title: "With your permission, Instagram regularly syncs your phone's contacts."
    detail: "Your phone's contact list is uploaded again and again and used for suggestions. Turning it off does not delete contacts that have already been uploaded."
    provenance: provided
    mechanisms: [permissions]
    evidence: stated
    condition: "only if you allow contact syncing"
    sources:
      - ref: instagram-help-contacts
        note: "„deine Kontaktliste [wird] regelmäßig synchronisiert“; Empfehlungen basierend auf der Kontaktliste"
  - id: ig-device
    category: device
    title: "Instagram collects technical data about your devices."
    detail: "Device type, operating system, numbers that make your device recognisable, your network and your internet connection's address (IP address). Also small files in your browser (cookies) and signals such as whether the app is currently in the foreground on your screen."
    technical: "The policy's category “App, browser and device information”, including identifiers, IP address, cookies and whether the app is in the foreground."
    provenance: observed
    mechanisms: [device]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "Kategorie „App-, Browser- und Geräteinformationen“"
      - ref: meta-help-less-personalised-ads
        note: "EU-Hilfeartikel: „Deine Geräteinformationen, wie etwa das Gerät oder den Browser, den du verwendest“ (bestätigt nur den Gerätetyp)"
  - id: ig-location
    category: location
    title: "Instagram uses information about your location."
    detail: "Your exact location, if you allow it in your device settings, and other information about where you are. Meta also uses a location for less personalised ads."
    provenance: observed
    mechanisms: [permissions, device]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Informationen, die du über deine Geräteeinstellungen geteilt hast (wie GPS-Standort)“"
      - meta-help-less-personalised-ads
  - id: ig-offplatform
    category: offplatform
    title: "Other websites and apps tell Meta what you do there."
    detail: "Many online shops and apps include small pieces of code from Meta (called pixels or SDKs). These send Meta things like page views or purchases. Depending on your settings, this can affect the ads you see on Instagram."
    technical: "The setting for activity from other businesses applies to all accounts in the same Accounts Center."
    provenance: observed
    mechanisms: [partners]
    evidence: stated
    sources:
      - ref: meta-help-activity-other-businesses
        note: "„… gilt diese Einstellung für alle deine Konten in derselben Kontenübersicht“"
      - meta-pixel-docs
  - id: ig-cross-app
    category: activity
    title: "With a linked Facebook account, data flows in both directions."
    detail: "If Instagram and Facebook are in the same Accounts Center, Meta uses the information from both accounts for ads and suggestions. So what you do on Instagram can affect the ads on Facebook – and the other way round."
    provenance: observed
    mechanisms: [usage]
    evidence: stated
    condition: "only if the accounts are in the same Accounts Center"
    sources:
      - ref: meta-help-accounts-center
        note: "„… nutzen wir die Informationen dieser Konten, um dir … personalisiertere Werbung … zu bieten“"
      - ref: meta-help-how-ads-chosen
        note: "„Wenn du dein Facebook- und dein Instagram-Konto miteinander verknüpft hast …“"
  - id: ig-meta-ai
    category: prompts
    title: "What you ask Meta AI on Instagram is stored and analysed."
    detail: "Questions, images and answers in your exchanges with Meta AI, plus accompanying data. Meta uses them to tailor content to you, and in the EU also for AI training."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    condition: "only if you use Meta AI features"
    sources:
      - ref: instagram-privacy-policy
        note: "„Interaktionen mit unseren Funktionen, die Teil von KI bei Meta sind, und zugehörige Metadaten“"
      - meta-newsroom-ai-training-eu-2025
inferences:
  - id: ig-ad-interests
    title: "Meta works out from your behaviour what you are interested in."
    detail: "Meta assigns ad topics and preferences to you. This is based on your activity and, depending on your settings, data from other businesses. The ad topics apply to Facebook and Instagram. You can see them in your ad preferences."
    level: documented
    basedOn: [ig-activity, ig-ad-interactions, ig-offplatform, ig-profile]
    sources:
      - ref: meta-help-ad-preferences
        note: "Abschnitt „Werbethemen“: „… wovon du auf Facebook und Instagram weniger Werbung sehen möchtest“; „Themen, die für Interessenkategorien stehen“"
      - meta-help-ad-preferences-overview
  - id: ig-content-preferences
    title: "Instagram estimates which content interests you."
    detail: "Meta automatically estimates your interests and preferences. Instagram uses this to sort your feed, Reels and suggestions – for example by topics or creators you watch for longer."
    level: documented
    basedOn: [ig-activity, ig-connections, ig-content]
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt „Personalisierung der Meta-Produkte“: „um deine Interessen und Präferenzen zu bewerten“"
  - id: ig-who-you-know
    title: "Instagram guesses who you know."
    detail: "Account suggestions are based, among other things, on your contact list if you allow syncing, and on your connections."
    level: documented
    basedOn: [ig-contact-sync, ig-connections]
    sources:
      - ref: instagram-help-contacts
        note: "„… erhältst du keine Empfehlungen mehr von Instagram, die auf der Kontaktliste deines Geräts basieren“"
  - id: ig-life-situation-possible
    title: "Photos and habits could reveal your life circumstances."
    detail: "If you often look at or post baby photos, fitness content or travel destinations, this reveals your stage of life and your habits. This is a technical possibility, not a practice Meta describes for Instagram. According to Meta, it does not use specially protected information that you have chosen to provide for ads."
    level: possible
    basedOn: [ig-activity, ig-content, ig-location]
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt zu „Informationen mit besonderem Schutz“"
purposes:
  - purpose: provide-service
    detail: "Providing your profile, feed, stories, reels and direct messages."
    sources: [instagram-privacy-policy]
  - purpose: personalisation
    detail: "Tailoring your feed, Reels, Explore and account suggestions to you."
    sources: [instagram-privacy-policy, instagram-help-contacts]
  - purpose: advertising
    detail: "Choosing ads. In the EU, this depends on your choice: fully personalised, less personalised or no ads at all with a subscription."
    sources: [meta-help-ads-choices-eu, meta-help-manage-ad-experience]
  - purpose: measurement
    detail: "Showing businesses and creators how their ads and content perform."
    sources: [instagram-privacy-policy]
  - purpose: safety
    detail: "Checking accounts and detecting spam, fraud and rule violations."
    sources: [instagram-privacy-policy]
  - purpose: ai-training
    detail: "Since May 2025, Meta has been using public posts and comments by adults in the EU, as well as conversations with Meta AI, for AI training. You can object."
    sources: [meta-newsroom-ai-training-eu-2025, meta-dpc-ai-statement-2025]
sharing:
  - id: ig-share-meta-companies
    recipient: "Other Meta companies (e.g. Facebook, WhatsApp)"
    detail: "Meta shares information and systems across the whole group. If your accounts are in the same Accounts Center, Meta tailors ads and suggestions to you across all these accounts."
    sources: [instagram-privacy-policy, meta-help-accounts-center]
  - id: ig-share-advertisers
    recipient: "Advertisers and analytics partners"
    detail: "They receive reports on how their ads perform. According to Meta, it only shares data that directly identifies you with your consent."
    sources: [instagram-privacy-policy, meta-help-how-ads-chosen]
  - id: ig-share-integrated-partners
    recipient: "Connected apps and services"
    detail: "If you connect Instagram to other apps, they receive information about you and your activity. They can always see public content."
    sources: [instagram-privacy-policy]
retention:
  text: "Meta stores information “on a case-by-case basis”: as long as it is needed to run the service, for legal obligations or for legitimate purposes. After you delete your account, final removal takes up to 90 days. Copies in backups can last longer."
  sources:
    - ref: instagram-privacy-policy
      note: "Abschnitt „Wie lange behalten wir deine Informationen?“"
    - ref: instagram-help-delete-account
      note: "„Der Zeitraum bis zur endgültigen Löschung kann bis zu 90 Tage betragen“"
journey:
  - id: ig-journey-use
    title: "You scroll, post and message"
    detail: "Every view, every like and every second you spend looking at something is stored – together with data about your device and network."
    dataPoints: [ig-content, ig-activity, ig-ad-interactions, ig-device, ig-location]
    sources: [instagram-privacy-policy]
  - id: ig-journey-partners
    title: "Other businesses report to Meta"
    detail: "Websites and apps with pieces of code from Meta (pixel or SDK) report things like purchases."
    dataPoints: [ig-offplatform]
    sources: [meta-help-activity-other-businesses, meta-pixel-docs]
  - id: ig-journey-account
    title: "Account and Accounts Center"
    detail: "Everything is linked to your account. With a linked Facebook or WhatsApp account, Meta also uses the data across these accounts."
    dataPoints: [ig-profile, ig-connections, ig-contact-sync, ig-cross-app]
    sources: [meta-help-accounts-center]
  - id: ig-journey-recommendations
    title: "Suggestions for you"
    detail: "Meta's systems estimate your interests and use them to sort your feed, Reels and account suggestions."
    dataPoints: [ig-activity, ig-connections, ig-contact-sync]
    sources: [instagram-privacy-policy, instagram-help-contacts]
  - id: ig-journey-ads
    title: "Ads and measurement"
    detail: "Meta picks ads that are meant to suit you – in the EU only as far as your ad choice allows. Advertisers then receive reports."
    dataPoints: [ig-profile, ig-activity, ig-ad-interactions, ig-offplatform]
    sources: [instagram-privacy-policy, meta-help-ads-choices-eu]
assessment:
  breadth:
    level: 4
    rationale: "Very broad: profile, content, detailed usage behaviour, device and location data, contacts. On top of that comes data from other websites and apps."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-activity-other-businesses, meta-help-manage-ad-experience]
  sensitivity:
    level: 4
    rationale: "Direct messages are a central part of Instagram, and since May 2026 they no longer have end-to-end encryption. So Meta can process message content – according to the policy, for example for running the service and for safety. On top of that come often private photos, location and contacts. According to Meta, it does not use specially protected information for ads."
    confidence: medium
    sources: [instagram-privacy-policy, instagram-help-e2ee]
  observation:
    level: 4
    rationale: "Instagram constantly records what you look at, when and for how long. This is at the heart of Reels and the feed."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-manage-ad-experience]
  linkability:
    level: 4
    rationale: "Meta uses data across its products. On top of that comes data from other websites and apps."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-accounts-center, meta-help-activity-other-businesses]
  adUse:
    level: 4
    rationale: "Advertising is Meta's core business, and Instagram is one of the most important places for it."
    confidence: high
    sources: [meta-sec-10q-2026-q2]
  sharing:
    level: 3
    rationale: "Service providers and other Meta companies receive data. Advertisers receive reports, and connected apps receive data. According to Meta, it only shares what directly identifies you with your consent."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-how-ads-chosen]
  defaults:
    level: 2
    rationale: "In the EU, you actively choose which kind of ads you get. The analysis for your feed and Reels and AI training on public posts continue as long as you do not object."
    confidence: medium
    sources: [meta-help-ads-choices-eu, meta-newsroom-ai-training-eu-2025]
  controls:
    level: 3
    rationale: "You can limit how closely ads are tailored to you. You can also control ad topics, data from other businesses for ads, contact syncing and AI training. You cannot turn off the analysis of your behaviour for the feed."
    confidence: medium
    sources: [meta-help-manage-ad-experience, meta-help-ad-preferences, instagram-help-contacts]
  deletion:
    level: 3
    rationale: "You can download your data and delete your account yourself. Synced contacts can only be deleted all together. There is no automatic deletion after a fixed period."
    confidence: medium
    sources: [instagram-help-export, instagram-help-delete-account, instagram-help-contacts]
  reachability:
    level: 3
    rationale: "Most settings are in Accounts Center or your Meta account. Some things only work on a computer, such as deleting synced contacts."
    confidence: medium
    sources: [meta-help-accounts-center, instagram-help-contacts]
linkedWith: [facebook, whatsapp]
region: EU
reviewedAt: "2026-10-07"
