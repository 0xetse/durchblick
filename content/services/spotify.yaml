assessment:
  breadth:
    level: 3
    rationale: "Neben Konto, Zahlungen und Geräten erfasst Spotify jeden Stream, Suchanfragen, Playlists und den ungefähren Standort. Auf Wunsch kommen Stimme, Nachrichten und genauer Standort dazu. Werbepartner liefern weitere Daten. Dein Adressbuch oder deine Fotos nennt die Richtlinie nicht."
    confidence: high
    sources: [spotify-privacy-policy]
  sensitivity:
    level: 2
    rationale: "Musik und Podcasts verraten vor allem Vorlieben und Stimmungen. Podcasts über Gesundheit, Glauben oder Politik können mehr verraten. Sehr Persönliches wie Sprachaufnahmen oder Nachrichten fällt nur an, wenn du diese Funktionen nutzt."
    confidence: medium
    sources: [spotify-privacy-policy, spotify-help-ad-preferences]
  observation:
    level: 4
    rationale: "Spotify zeichnet jeden Stream auf die Millisekunde auf, mit Gerät, IP-Adresse, Weiterspringen und Grund für Start und Ende. Diese Daten sind die Grundlage für Empfehlungen und das Geschmacksprofil."
    confidence: high
    sources: [spotify-help-understanding-data, spotify-help-taste-profile]
  linkability:
    level: 4
    rationale: "Spotify verbindet dein Konto über alle Geräte. Ab Werk erhält es zusätzlich Daten von Werbe- und Marketingpartnern, etwa Kontaktdaten und deren Schlüsse über deine Interessen. Dazu kommen Daten von Anmeldediensten wie Facebook und von verbundenen Apps."
    confidence: medium
    sources: [spotify-privacy-policy, spotify-gdpr-article-15]
  adUse:
    level: 2
    rationale: "Werbung bringt Spotify weniger als ein Zehntel des Umsatzes. Der Großteil kommt aus Abos. In der kostenlosen Version ist auf dich zugeschnittene Werbung aber Alltag."
    confidence: high
    sources: [spotify-q2-2026-update, spotify-privacy-policy]
  sharing:
    level: 3
    rationale: "Neben Dienstleistern und Firmen der Spotify-Gruppe bekommen Werbe- und Marketingpartner Konto- und Nutzungsdaten. Podcast-Anbieter erhalten deine IP-Adresse. Rechteinhaber und Forschende bekommen Hördaten nur unter einer Nummer statt unter deinem Namen."
    confidence: medium
    sources: [spotify-privacy-policy, spotify-cookie-policy]
  defaults:
    level: 2
    rationale: "Auf dich zugeschnittene Werbung und Daten von Werbepartnern sind an, bis du widersprichst. Kürzlich gehörte Künstler*innen sind laut Spotify-Hilfe öffentlich. Ob deine Höraktivität ab Werk geteilt wird, beschreiben zwei Hilfeseiten unterschiedlich. Schützend: Suchanfragen löscht Spotify nach 90 Tagen, den genauen Standort gibt es nur mit Erlaubnis."
    confidence: medium
    sources: [spotify-privacy-policy, spotify-gdpr-article-15, spotify-help-recently-played, spotify-help-privacy-social, spotify-help-listening-activity]
  controls:
    level: 3
    rationale: "Du kannst Werbung nach Interessen, Facebook-Daten, Sichtbarkeit für andere, verbundene Apps und den Standort-Zugriff steuern. Einzelne Playlists lassen sich aus dem Geschmacksprofil nehmen. Dass Spotify jeden Stream speichert, kannst du nicht abschalten – auch nicht mit der „Private Session“."
    confidence: medium
    sources: [spotify-help-data-rights, spotify-help-privacy-social, spotify-help-taste-profile, spotify-help-understanding-data]
  deletion:
    level: 3
    rationale: "Datenpakete und Kontolöschung gibt es zum Selbstmachen. Den Streamingverlauf kannst du aber nicht einzeln löschen, nur mit dem ganzen Konto. Die schwedische Datenschutzbehörde verhängte 2023 ein Bußgeld von 58 Millionen Kronen, weil Spotify bei Auskünften nicht klar genug erklärte, wie es die Daten nutzt. Ein Gericht bestätigte das 2025."
    confidence: medium
    sources: [spotify-help-data-rights, spotify-help-close-account, spotify-privacy-policy, spotify-imy-fine-2023, spotify-tv4-court-2025]
  reachability:
    level: 3
    rationale: "Werbung, Facebook-Daten und Datenpaket findest du zentral auf der Seite „Datenschutzeinstellungen für dein Konto“ im Browser. Sichtbarkeit für andere und Private Session stellst du in der App ein. Verbundene Apps verwaltest du auf einer eigenen Seite."
    confidence: medium
    sources: [spotify-help-data-rights, spotify-help-privacy-social, spotify-help-connected-apps]
region: EU
