id: instagram
name: Instagram
company: meta
category: social
url: https://www.instagram.com/
summary: "Instagram wertet aus, welche Fotos, Reels und Accounts du dir ansiehst. Das nutzt es für Feed und Werbung, zusammen mit Daten von fremden Websites und Apps. Es gilt dieselbe Datenschutzrichtlinie wie für Facebook."
surprise:
  action: instagram-contacts
  text: "Schaltest du den Abgleich deiner Handy-Kontakte (Kontaktsynchronisierung) aus, bleiben die schon hochgeladenen Kontakte gespeichert. Löschen kannst du sie nur alle auf einmal am Computer. Danach kann Instagram dir noch bis zu 90 Tage lang Vorschläge auf Basis deiner Kontakte machen."
  sources:
    - ref: instagram-help-contacts
      note: "„Wenn du das Synchronisieren der Kontakte deaktivierst, werden dadurch keine zuvor synchronisierten Kontakte gelöscht“; „Du kannst keine einzelnen Kontakte von Instagram löschen“; bis zu 90 Tage"
businessModel:
  text: "Instagram finanziert sich wie Facebook über Werbung. Meta macht fast seinen ganzen Umsatz mit Anzeigen auf Facebook, Instagram, Messenger und Partner-Apps. In der EU gibt es zusätzlich ein Abo ohne Werbung."
  sources:
    - ref: meta-sec-10q-2026-q2
      note: "„Our advertising revenue is generated by displaying ad products on Facebook, Instagram, Messenger, and third-party mobile applications.“"
    - meta-help-ads-subscription
dataPoints:
  - id: ig-profile
    category: account
    title: "Du gibst Instagram Angaben zu deiner Person."
    detail: "Etwa Benutzername, Name, Kontaktdaten und freiwillige Profilangaben wie Profilbild oder Bio. Alter, angegebenes Geschlecht und Standort nutzt Meta auch für Werbung."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt „Welche Informationen erheben wir?“"
      - ref: meta-help-manage-ad-experience
        note: "Profilinformationen wie Alter, angegebenes Geschlecht, Standort"
  - id: ig-content
    category: content
    title: "Instagram speichert deine Fotos, Videos, Stories und Reels."
    detail: "Dazu Bildunterschriften, Kommentare, Hashtags, Audio und Inhalte aus der Kamerafunktion. Außerdem Begleitdaten wie Aufnahmezeit oder Ort."
    technical: "Meta nennt diese Begleitdaten „Metadaten zu Inhalten und Nachrichten“."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Inhalte, die du erstellst, wie Beiträge, Kommentare oder Audio“; „Inhalte, die du über unsere Kamerafunktion … bereitstellst“; „Hashtags“"
  - id: ig-messages
    category: communications
    title: "Meta kann auch Direktnachrichten verarbeiten – soweit das Recht es erlaubt."
    detail: "Die Richtlinie nennt Nachrichten „einschließlich ihrer Inhalte, vorbehaltlich des anwendbaren Rechts“, etwa für Betrieb und Sicherheit. Um Inhalte und Werbung auf dich zuzuschneiden, nennt Meta nur Begleitdaten zu Nachrichten."
    technical: "Für die Personalisierung listet die Richtlinie nur „Metadaten zu … Nachrichten“. Laut Instagram-Hilfe werden Ende-zu-Ende-verschlüsselte Nachrichten auf Instagram seit dem 8. Mai 2026 nicht mehr unterstützt; für verschlüsselte Chats verweist Meta auf WhatsApp."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt „Warum und wie wir deine Informationen verarbeiten“"
      - ref: instagram-help-e2ee
        note: "„Ende-zu-Ende-verschlüsselte Nachrichten auf Instagram werden seit dem 8. Mai 2026 nicht mehr unterstützt.“"
  - id: ig-activity
    category: activity
    title: "Instagram registriert, was du anschaust und wie lange."
    detail: "Welche Reels, Beiträge und Profile du ansiehst, likest, speicherst oder überspringst. Und wann, wie oft und wie lange du die App nutzt. Danach richten sich Feed, Reels und Entdecken."
    provenance: observed
    mechanisms: [usage]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Die Arten von Inhalten, die du dir ansiehst bzw. mit denen du interagierst“; „Zeitpunkt, Häufigkeit und Dauer deiner Aktivitäten“"
      - ref: meta-help-manage-ad-experience
        note: "EU-Hilfeartikel, Liste „Personalisierte Werbung“: „Die Inhalte, die du dir in unseren Produkten ansiehst bzw. mit denen du interagierst“"
  - id: ig-ad-interactions
    category: activity
    title: "Instagram merkt sich, wie du auf Werbung reagierst."
    detail: "Klicks, Likes und andere Reaktionen auf Anzeigen. Das gilt auch bei weniger personalisierter Werbung."
    provenance: observed
    mechanisms: [usage]
    evidence: stated
    sources:
      - ref: meta-help-less-personalised-ads
        note: "„Deine Interaktionen mit Werbeanzeigen wie etwa Anklicken oder ‚Gefällt mir‘-Angaben“"
  - id: ig-connections
    category: contacts
    title: "Instagram kennt deine Follower und die Accounts, denen du folgst."
    detail: "Wem du folgst, wer dir folgt, mit wem du schreibst. Andere können dich markieren oder deine Inhalte teilen."
    provenance: provided
    mechanisms: [provided, other-users]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Freund*innen, Abonnent*innen und andere Kontakte“"
  - id: ig-contact-sync
    category: contacts
    title: "Mit deiner Erlaubnis gleicht Instagram regelmäßig dein Telefonbuch ab."
    detail: "Die Kontaktliste deines Handys wird immer wieder hochgeladen und für Vorschläge genutzt. Abschalten löscht schon hochgeladene Kontakte nicht."
    provenance: provided
    mechanisms: [permissions]
    evidence: stated
    condition: "nur wenn du die Kontaktsynchronisierung erlaubst"
    sources:
      - ref: instagram-help-contacts
        note: "„deine Kontaktliste [wird] regelmäßig synchronisiert“; Empfehlungen basierend auf der Kontaktliste"
  - id: ig-device
    category: device
    title: "Instagram erfasst technische Daten deiner Geräte."
    detail: "Gerätetyp, Betriebssystem, Nummern, die dein Gerät erkennbar machen, dein Netzwerk und die Internet-Adresse deines Anschlusses (IP-Adresse). Dazu kleine Dateien im Browser (Cookies) und Hinweise wie die Frage, ob die App gerade vorne auf dem Bildschirm ist."
    technical: "Kategorie „App-, Browser- und Geräteinformationen“ der Richtlinie, u. a. Identifikatoren, IP-Adresse, Cookies und App im Vordergrund."
    provenance: observed
    mechanisms: [device]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "Kategorie „App-, Browser- und Geräteinformationen“"
      - ref: meta-help-less-personalised-ads
        note: "EU-Hilfeartikel: „Deine Geräteinformationen, wie etwa das Gerät oder den Browser, den du verwendest“ (bestätigt nur den Gerätetyp)"
  - id: ig-location
    category: location
    title: "Instagram nutzt Angaben zu deinem Standort."
    detail: "Den genauen Standort, wenn du ihn in den Geräteeinstellungen freigibst, und weitere Informationen zu deinem Ort. Einen Standort nutzt Meta auch bei weniger personalisierter Werbung."
    provenance: observed
    mechanisms: [permissions, device]
    evidence: stated
    sources:
      - ref: instagram-privacy-policy
        note: "„Informationen, die du über deine Geräteeinstellungen geteilt hast (wie GPS-Standort)“"
      - meta-help-less-personalised-ads
  - id: ig-offplatform
    category: offplatform
    title: "Fremde Websites und Apps melden Meta, was du dort tust."
    detail: "Viele Online-Shops und Apps bauen kleine Code-Bausteine von Meta ein (sogenannte Pixel oder SDKs). Diese schicken Meta zum Beispiel Seitenaufrufe oder Käufe. Je nach deinen Einstellungen kann das die Werbung auf Instagram beeinflussen."
    technical: "Die Einstellung „Aktivitäten bei anderen Unternehmen“ gilt für alle Konten derselben Kontenübersicht."
    provenance: observed
    mechanisms: [partners]
    evidence: stated
    sources:
      - ref: meta-help-activity-other-businesses
        note: "„… gilt diese Einstellung für alle deine Konten in derselben Kontenübersicht“"
      - meta-pixel-docs
  - id: ig-cross-app
    category: activity
    title: "Mit verknüpftem Facebook-Konto fließen Daten in beide Richtungen."
    detail: "Sind Instagram und Facebook in derselben Kontenübersicht, nutzt Meta die Informationen beider Konten für Werbung und Vorschläge. Was du auf Instagram tust, kann also die Werbung auf Facebook beeinflussen – und umgekehrt."
    provenance: observed
    mechanisms: [usage]
    evidence: stated
    condition: "nur wenn die Konten in derselben Kontenübersicht sind"
    sources:
      - ref: meta-help-accounts-center
        note: "„… nutzen wir die Informationen dieser Konten, um dir … personalisiertere Werbung … zu bieten“"
      - ref: meta-help-how-ads-chosen
        note: "„Wenn du dein Facebook- und dein Instagram-Konto miteinander verknüpft hast …“"
  - id: ig-meta-ai
    category: prompts
    title: "Was du Meta AI auf Instagram fragst, wird gespeichert und ausgewertet."
    detail: "Fragen, Bilder und Antworten im Austausch mit Meta AI, dazu Begleitdaten. Meta nutzt sie, um Inhalte auf dich zuzuschneiden, und in der EU auch für KI-Training."
    provenance: provided
    mechanisms: [provided]
    evidence: stated
    condition: "nur wenn du Meta-AI-Funktionen nutzt"
    sources:
      - ref: instagram-privacy-policy
        note: "„Interaktionen mit unseren Funktionen, die Teil von KI bei Meta sind, und zugehörige Metadaten“"
      - meta-newsroom-ai-training-eu-2025
inferences:
  - id: ig-ad-interests
    title: "Meta leitet aus deinem Verhalten ab, wofür du dich interessierst."
    detail: "Meta ordnet dir Werbethemen und Vorlieben zu. Grundlage ist deine Aktivität und, je nach Einstellung, Daten von anderen Unternehmen. Die Werbethemen gelten für Facebook und Instagram. Du siehst sie in den Werbepräferenzen."
    level: documented
    basedOn: [ig-activity, ig-ad-interactions, ig-offplatform, ig-profile]
    sources:
      - ref: meta-help-ad-preferences
        note: "Abschnitt „Werbethemen“: „… wovon du auf Facebook und Instagram weniger Werbung sehen möchtest“; „Themen, die für Interessenkategorien stehen“"
      - meta-help-ad-preferences-overview
  - id: ig-content-preferences
    title: "Instagram schätzt ein, welche Inhalte dich interessieren."
    detail: "Meta schätzt automatisch deine Interessen und Vorlieben ein. Danach sortiert Instagram Feed, Reels und Vorschläge – etwa nach Themen oder Creator*innen, die du länger anschaust."
    level: documented
    basedOn: [ig-activity, ig-connections, ig-content]
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt „Personalisierung der Meta-Produkte“: „um deine Interessen und Präferenzen zu bewerten“"
  - id: ig-who-you-know
    title: "Instagram vermutet, wen du kennst."
    detail: "Kontovorschläge beruhen unter anderem auf deiner Kontaktliste, wenn du die Synchronisierung erlaubst, und auf deinen Verbindungen."
    level: documented
    basedOn: [ig-contact-sync, ig-connections]
    sources:
      - ref: instagram-help-contacts
        note: "„… erhältst du keine Empfehlungen mehr von Instagram, die auf der Kontaktliste deines Geräts basieren“"
  - id: ig-life-situation-possible
    title: "Aus Fotos und Gewohnheiten ließen sich Lebensumstände ablesen."
    detail: "Wer oft Babyfotos, Fitness-Inhalte oder Reiseziele ansieht oder postet, verrät Lebensphase und Gewohnheiten. Das ist eine technische Möglichkeit, keine von Meta beschriebene Praxis für Instagram. Freiwillig angegebene, besonders geschützte Angaben nutzt Meta nach eigener Aussage nicht für Werbung."
    level: possible
    basedOn: [ig-activity, ig-content, ig-location]
    sources:
      - ref: instagram-privacy-policy
        note: "Abschnitt zu „Informationen mit besonderem Schutz“"
purposes:
  - purpose: provide-service
    detail: "Profil, Feed, Stories, Reels und Direktnachrichten bereitstellen."
    sources: [instagram-privacy-policy]
  - purpose: personalisation
    detail: "Feed, Reels, Entdecken und Kontovorschläge auf dich zuschneiden."
    sources: [instagram-privacy-policy, instagram-help-contacts]
  - purpose: advertising
    detail: "Werbung auswählen. In der EU hängt das von deiner Wahl ab: voll personalisiert, weniger personalisiert oder gar keine Werbung im Abo."
    sources: [meta-help-ads-choices-eu, meta-help-manage-ad-experience]
  - purpose: measurement
    detail: "Unternehmen und Creator*innen zeigen, wie ihre Anzeigen und Inhalte funktionieren."
    sources: [instagram-privacy-policy]
  - purpose: safety
    detail: "Konten prüfen sowie Spam, Betrug und Verstöße erkennen."
    sources: [instagram-privacy-policy]
  - purpose: ai-training
    detail: "Seit Mai 2025 nutzt Meta öffentliche Beiträge und Kommentare Erwachsener in der EU sowie Gespräche mit Meta AI für KI-Training. Du kannst widersprechen."
    sources: [meta-newsroom-ai-training-eu-2025, meta-dpc-ai-statement-2025]
sharing:
  - id: ig-share-meta-companies
    recipient: "Andere Meta-Unternehmen (z. B. Facebook, WhatsApp)"
    detail: "Meta teilt Informationen und Systeme im ganzen Konzern. Sind deine Konten in derselben Kontenübersicht, schneidet Meta Werbung und Vorschläge über alle diese Konten hinweg auf dich zu."
    sources: [instagram-privacy-policy, meta-help-accounts-center]
  - id: ig-share-advertisers
    recipient: "Werbekunden und Analysepartner"
    detail: "Sie erhalten Berichte, wie ihre Anzeigen wirken. Daten, die dich direkt erkennbar machen, gibt Meta nach eigener Aussage nur mit deiner Zustimmung weiter."
    sources: [instagram-privacy-policy, meta-help-how-ads-chosen]
  - id: ig-share-integrated-partners
    recipient: "Verbundene Apps und Dienste"
    detail: "Verbindest du Instagram mit anderen Apps, erhalten diese Informationen über dich und deine Aktivität. Öffentliche Inhalte können sie immer sehen."
    sources: [instagram-privacy-policy]
retention:
  text: "Meta speichert Informationen „von Fall zu Fall“: solange sie für den Betrieb, für rechtliche Pflichten oder für berechtigte Zwecke gebraucht werden. Nach einer Kontolöschung dauert das endgültige Entfernen bis zu 90 Tage. Kopien in Sicherungen (Backups) können länger bestehen."
  sources:
    - ref: instagram-privacy-policy
      note: "Abschnitt „Wie lange behalten wir deine Informationen?“"
    - ref: instagram-help-delete-account
      note: "„Der Zeitraum bis zur endgültigen Löschung kann bis zu 90 Tage betragen“"
journey:
  - id: ig-journey-use
    title: "Du scrollst, postest und schreibst"
    detail: "Jeder Aufruf, jedes Like und jede Sekunde, die du etwas ansiehst, wird gespeichert – zusammen mit Daten über Gerät und Netzwerk."
    dataPoints: [ig-content, ig-activity, ig-ad-interactions, ig-device, ig-location]
    sources: [instagram-privacy-policy]
  - id: ig-journey-partners
    title: "Andere Unternehmen melden sich bei Meta"
    detail: "Websites und Apps mit Code-Bausteinen von Meta (Pixel oder SDK) melden zum Beispiel Käufe."
    dataPoints: [ig-offplatform]
    sources: [meta-help-activity-other-businesses, meta-pixel-docs]
  - id: ig-journey-account
    title: "Konto und Kontenübersicht"
    detail: "Alles wird deinem Konto zugeordnet. Mit verknüpftem Facebook- oder WhatsApp-Konto nutzt Meta die Daten auch über diese Konten hinweg."
    dataPoints: [ig-profile, ig-connections, ig-contact-sync, ig-cross-app]
    sources: [meta-help-accounts-center]
  - id: ig-journey-recommendations
    title: "Vorschläge für dich"
    detail: "Metas Systeme schätzen deine Interessen ein und sortieren danach Feed, Reels und Kontovorschläge."
    dataPoints: [ig-activity, ig-connections, ig-contact-sync]
    sources: [instagram-privacy-policy, instagram-help-contacts]
  - id: ig-journey-ads
    title: "Werbung und Auswertung"
    detail: "Meta sucht Werbung aus, die zu dir passen soll – in der EU nur so weit, wie deine Werbewahl es erlaubt. Werbekunden bekommen danach Berichte."
    dataPoints: [ig-profile, ig-activity, ig-ad-interactions, ig-offplatform]
    sources: [instagram-privacy-policy, meta-help-ads-choices-eu]
assessment:
  breadth:
    level: 4
    rationale: "Sehr breit: Profil, Inhalte, genaues Nutzungsverhalten, Geräte- und Standortdaten, Kontakte. Dazu kommen Daten von fremden Websites und Apps."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-activity-other-businesses, meta-help-manage-ad-experience]
  sensitivity:
    level: 4
    rationale: "Direktnachrichten sind ein zentraler Teil von Instagram, und seit Mai 2026 gibt es dort keine Ende-zu-Ende-Verschlüsselung mehr. Meta kann Nachrichteninhalte also verarbeiten, laut Richtlinie etwa für Betrieb und Sicherheit. Dazu kommen oft private Fotos, Standort und Kontakte. Für Werbung nutzt Meta besonders geschützte Angaben nach eigener Aussage nicht."
    confidence: medium
    sources: [instagram-privacy-policy, instagram-help-e2ee]
  observation:
    level: 4
    rationale: "Instagram hält laufend fest, was du ansiehst, wann und wie lange. Das ist das Herzstück von Reels und Feed."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-manage-ad-experience]
  linkability:
    level: 4
    rationale: "Meta nutzt Daten über seine Produkte hinweg. Dazu kommen Daten von fremden Websites und Apps."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-accounts-center, meta-help-activity-other-businesses]
  adUse:
    level: 4
    rationale: "Werbung ist das Kerngeschäft von Meta, und Instagram ist einer der wichtigsten Orte dafür."
    confidence: high
    sources: [meta-sec-10q-2026-q2]
  sharing:
    level: 3
    rationale: "Dienstleister und andere Meta-Firmen bekommen Daten. Werbekunden erhalten Berichte, verbundene Apps bekommen Daten. Was dich direkt erkennbar macht, gibt Meta nach eigener Aussage nur mit Zustimmung weiter."
    confidence: medium
    sources: [instagram-privacy-policy, meta-help-how-ads-chosen]
  defaults:
    level: 2
    rationale: "In der EU wählst du aktiv, welche Art Werbung du bekommst. Die Auswertung für Feed und Reels und das KI-Training mit öffentlichen Beiträgen laufen, solange du nicht widersprichst."
    confidence: medium
    sources: [meta-help-ads-choices-eu, meta-newsroom-ai-training-eu-2025]
  controls:
    level: 3
    rationale: "Du kannst einschränken, wie stark Werbung auf dich zugeschnitten ist. Das gilt auch für Werbethemen, Daten von anderen Unternehmen für Werbung, die Kontaktsynchronisierung und KI-Training. Die Auswertung deines Verhaltens für den Feed kannst du nicht abschalten."
    confidence: medium
    sources: [meta-help-manage-ad-experience, meta-help-ad-preferences, instagram-help-contacts]
  deletion:
    level: 3
    rationale: "Daten herunterladen und Konto löschen kannst du selbst. Synchronisierte Kontakte lassen sich nur alle zusammen löschen. Ein automatisches Löschen nach einer festen Zeit gibt es nicht."
    confidence: medium
    sources: [instagram-help-export, instagram-help-delete-account, instagram-help-contacts]
  reachability:
    level: 3
    rationale: "Die meisten Einstellungen liegen in der Kontenübersicht bzw. im Meta-Konto. Manches geht nur am Computer, etwa das Löschen synchronisierter Kontakte."
    confidence: medium
    sources: [meta-help-accounts-center, instagram-help-contacts]
linkedWith: [facebook, whatsapp]
region: EU
reviewedAt: "2026-10-07"
