      price: "Kostenlos."
      openSource: "no"
      encryption: "HTTPS; keine Ende-zu-Ende-Verschlüsselung."
      dataCollection: "Suchen und Standort können mit dem Google-Konto verknüpft werden; die Zeitachse (Standortverlauf) ist optional und wird inzwischen auf dem Gerät gespeichert."
