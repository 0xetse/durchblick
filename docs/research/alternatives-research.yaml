  # ---------------------------------------------------------------- SEARCH
  - id: search
    title: Suche
    einordnung: "Suchanfragen verraten viel über Gesundheit, Pläne und Sorgen. Die Alternativen verknüpfen Suchen nicht mit einem Konto oder Profil, zeigen aber weiterhin Werbung – nur kontextbezogen statt personalisiert. Bei Google lässt sich viel erreichen, indem man abgemeldet sucht oder „Web- & App-Aktivitäten“ pausiert bzw. automatisch löschen lässt und personalisierte Werbung abschaltet. Wer häufig sehr lokale oder spezielle Treffer braucht, wird bei Google oft schneller fündig."
    incumbent:
      id: google-search
      name: Google Suche
      provider: Google LLC
      jurisdiction: USA
      businessModel: "Suchwerbung – Googles größte Einnahmequelle."
      price: "Kostenlos."
      openSource: "no"
      encryption: "HTTPS-Verbindung; keine Ende-zu-Ende-Verschlüsselung (bei Suche nicht üblich)."
      dataCollection: "Suchen können bei Anmeldung in „Web- & App-Aktivitäten“ gespeichert und für Personalisierung und Werbung genutzt werden; Einstellungen erlauben Pausieren und automatisches Löschen."
      strengths:
        - "Größter Index, sehr gute lokale Ergebnisse."
        - "Viele Direktantworten (Karten, Fahrpläne, Öffnungszeiten)."
      tradeOffs:
        - "Personalisierung basiert auf Nutzungsdaten."
        - "Viel Werbung und eigene Dienste prominent platziert."
      switchingEffort: "low – Ausgangspunkt."
      sources:
        - {title: "Google Privacy Policy", publisher: "Google", url: "https://policies.google.com/privacy", type: privacy-policy, tier: 1}
      needsVerification: false
    alternatives:
      - id: duckduckgo
        name: DuckDuckGo
        provider: Duck Duck Go, Inc.
        jurisdiction: USA
        businessModel: "Kontextbezogene Suchwerbung über das Microsoft-Werbenetz, dazu Abo (Plus/Pro)."
        price: "Suche kostenlos; Abo Plus 9,99 USD/Monat (EUR-Preis regional abweichend)."
        openSource: "partial – Browser-Apps sind Open Source (https://github.com/duckduckgo), die Suchmaschine nicht."
        encryption: "HTTPS; keine Ende-zu-Ende-Verschlüsselung (bei Suche nicht üblich)."
        dataCollection: "Speichert laut Datenschutzerklärung keine IP-Adressen zusammen mit Suchen und keine eindeutigen Kennungen; Klicks auf Anzeigen laufen über Microsoft."
        strengths:
          - "Kein Konto, kein Suchprofil."
          - "Bekannt, in vielen Browsern als Standardsuche wählbar."
        tradeOffs:
          - "Ergebnisse stammen zu großen Teilen aus Bing."
