  # ---------------------------------------------------------------- EMAIL
  - id: email
    title: E-Mail
    einordnung: "Bei Gmail kann Google den Inhalt deiner Mails technisch lesen (etwa für Spamfilter und Funktionen), nutzt ihn laut eigener Aussage aber nicht für Werbung. Proton und Tuta verschlüsseln gespeicherte Mails so, dass der Anbieter sie nicht lesen kann; Posteo und mailbox.org bieten das optional. Wichtig: Mails an Menschen mit Gmail oder anderen Diensten sind meist nur auf dem Transportweg verschlüsselt – der Empfänger-Anbieter sieht sie trotzdem. Wer Gmail behält, gewinnt viel durch Zwei-Faktor-Anmeldung und das Abschalten personalisierter Werbung."
    incumbent:
      id: gmail
      name: Gmail
      provider: Google LLC (für EU-Nutzer Google Ireland Ltd.)
      jurisdiction: USA
      businessModel: "Werbung (personalisiert über die Google-Kontoaktivität) und Speicher-Abos (Google One) bzw. Workspace."
      price: "Kostenlos mit 15 GB (geteilt mit Drive und Fotos); mehr Speicher über Google One."
      openSource: "no"
      encryption: "Transportverschlüsselung (TLS); auf Servern verschlüsselt, aber mit Google-Schlüsseln – kein Ende-zu-Ende als Standard für Privatkunden."
      dataCollection: "Google gibt an, Gmail-Inhalte nicht für Werbung zu scannen; Anzeigen in Gmail basieren auf deiner sonstigen Aktivität im Google-Konto (abschaltbar)."
      strengths:
        - "Sehr guter Spamfilter und Suche."
        - "Tiefe Integration mit Kalender, Drive, Android."
        - "Kostenlos mit viel Speicher."
      tradeOffs:
        - "Anbieter kann Inhalte technisch lesen."
        - "Werbung im Posteingang (Tab „Werbung“)."
      switchingEffort: "low – Ausgangspunkt."
      sources:
        - {title: "Ads in Gmail", publisher: "Google Gmail Help", url: "https://support.google.com/mail/answer/6603", type: help-center, tier: 1}
      needsVerification: false
    alternatives:
      - id: proton-mail
        name: Proton Mail
        provider: Proton AG
        jurisdiction: Schweiz
        businessModel: "Abonnements; laut Proton ausschließlich durch zahlende Nutzer finanziert."
        price: "Kostenlos (1 GB); Mail Plus 4,99 €/Monat bzw. 3,99 €/Monat bei Jahreszahlung."
        openSource: "partial – Apps sind Open Source (https://github.com/ProtonMail), Server nicht."
        encryption: "Ende-zu-Ende zwischen Proton-Nutzern; gespeicherte Mails mit Zero-Access-Verschlüsselung (Proton kann Inhalte nicht lesen); Betreffzeilen sind nicht Ende-zu-Ende-verschlüsselt."
        dataCollection: "Speichert für den Betrieb nötige Metadaten (z. B. Absender, Empfänger, Zeitpunkt); keine Werbung."
        strengths:
          - "Starke Verschlüsselung, einfache Bedienung."
          - "Ökosystem mit Kalender, Drive, Passwortmanager, VPN."
          - "Gratisstufe verfügbar."
        tradeOffs:
          - "Kostenlose Stufe mit wenig Speicher."
          - "Externe Mailprogramme (Outlook, Thunderbird) nur mit Bezahlplan und Bridge-Software."
          - "Volltextsuche eingeschränkt, weil Inhalte verschlüsselt sind."
        switchingEffort: "medium – Import-Assistent für Gmail vorhanden, aber Adresse muss überall geändert werden."
        sources:
