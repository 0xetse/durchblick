  # ---------------------------------------------------------------- BROWSER
  - id: browser
    title: Browser
    einordnung: "Der Browser sieht alles, was du im Netz tust – deshalb wirkt ein Wechsel breit: Firefox, Brave und Safari blockieren Tracker von Haus aus stärker als Chrome, das Drittanbieter-Cookies weiterhin standardmäßig zulässt. Wer bei Chrome bleibt, erreicht viel mit wenigen Schaltern: Drittanbieter-Cookies blockieren, Synchronisierung bzw. Web- & App-Aktivitäten prüfen und eine andere Standardsuche einstellen. Ein Wechsel lohnt sich kaum, wenn du ohnehin fast nur eingeloggt in Google-Diensten arbeitest – dann sieht Google vieles auch unabhängig vom Browser."
    incumbent:
      id: google-chrome
      name: Google Chrome
      provider: Google LLC
      jurisdiction: USA
      businessModel: "Kostenlos; Chrome stärkt Googles Werbe- und Suchgeschäft, das Google den größten Teil seines Umsatzes bringt."
      price: "Kostenlos."
      openSource: "partial – basiert auf dem Open-Source-Projekt Chromium (https://chromium.googlesource.com/chromium/src), Chrome selbst ist proprietär."
      encryption: "Verschlüsselte Verbindungen (HTTPS) wie alle Browser; synchronisierte Daten sind standardmäßig mit Google-Schlüsseln geschützt, optional mit eigener Passphrase."
      dataCollection: "Bei Anmeldung und aktivierter Synchronisierung können Verlauf und Aktivitäten im Google-Konto landen; Drittanbieter-Cookies bleiben standardmäßig erlaubt, nachdem Google 2025 von der Abschaffung abgerückt ist."
      strengths:
        - "Sehr verbreitet, beste Kompatibilität mit Webseiten."
        - "Schnelle Sicherheitsupdates."
        - "Nahtlos mit Google-Konto auf allen Geräten."
      tradeOffs:
        - "Weniger eingebauter Tracking-Schutz als bei den Alternativen."
        - "Starke Verzahnung mit Googles Werbegeschäft."
      switchingEffort: "low – Ausgangspunkt."
      sources:
        - {title: "Google is scrapping Privacy Sandbox APIs as Chrome keeps third-party cookies", publisher: "Windows Report", url: "https://windowsreport.com/google-is-scrapping-privacy-sandbox-apis-as-chrome-keeps-third-party-cookies-after-all/", type: journalism, tier: 2}
        - {title: "Google has killed Privacy Sandbox", publisher: "Engadget", url: "https://engadget.com/cybersecurity/google-has-killed-privacy-sandbox-130029899.html", type: journalism, tier: 2}
      needsVerification: false
    alternatives:
