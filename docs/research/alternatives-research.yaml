        name: Firefox
        provider: Mozilla Corporation (Tochter der Mozilla Foundation)
        jurisdiction: USA
        businessModel: "Vor allem Umsatzbeteiligung aus Suchmaschinen-Verträgen (2024 laut Berichten rund 85 % des Umsatzes über Google), dazu Werbung auf der Neuer-Tab-Seite."
        price: "Kostenlos."
        openSource: "yes – https://github.com/mozilla-firefox/firefox"
        encryption: "Firefox-Sync ist Ende-zu-Ende-verschlüsselt (an das Konto-Passwort gebunden)."
        dataCollection: "Sendet standardmäßig technische und Nutzungsdaten an Mozilla (abschaltbar); zeigt gesponserte Inhalte auf der Neuer-Tab-Seite (abschaltbar)."
        strengths:
          - "Eigene Browser-Engine, nicht von Chromium abhängig."
          - "Erweiterter Tracking-Schutz standardmäßig aktiv."
          - "Viele Erweiterungen, auch auf Android."
        tradeOffs:
          - "Finanziell stark von Google abhängig."
          - "Telemetrie und Werbung auf der Startseite muss man selbst abschalten."
          - "Gelegentlich Kompatibilitätsprobleme mit Seiten, die nur für Chrome getestet sind."
        switchingEffort: "low – Lesezeichen und Passwörter lassen sich direkt aus Chrome importieren."
        sources:
          - {title: "Firefox Privacy Notice", publisher: "Mozilla", url: "https://www.mozilla.org/en-US/privacy/firefox/", type: privacy-policy, tier: 1}
          - {title: "Mozilla Also Defends Google Revenue Sharing Agreement", publisher: "Michael Tsai", url: "https://mjtsai.com/blog/2025/03/13/mozilla-also-defends-google-revenue-sharing-agreement", type: journalism, tier: 3}
