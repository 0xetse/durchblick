        price: "Kostenlos."
        openSource: "no"
        encryption: "HTTPS; personenbezogene Funktionen (z. B. geparktes Auto) laufen auf dem Gerät."
        dataCollection: "Laut Apple keine Verknüpfung mit der Apple-ID und kein Verlauf besuchter Orte; Daten zur Verbesserung nutzen wechselnde Zufallskennungen."
